<!doctype html>
<html lang="en">
  <!-- Meta Pixel: preserve the existing order conversion event. -->
  <script>
    !(function (f, b, e, v, n, t, s) {
      if (f.fbq) return;
      n = f.fbq = function () {
        n.callMethod
          ? n.callMethod.apply(n, arguments)
          : n.queue.push(arguments);
      };
      if (!f._fbq) f._fbq = n;
      n.push = n;
      n.loaded = !0;
      n.version = "2.0";
      n.queue = [];
      t = b.createElement(e);
      t.async = !0;
      t.src = v;
      s = b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t, s);
    })(
      window,
      document,
      "script",
      "https://connect.facebook.net/en_US/fbevents.js",
    );
    var eventID =
      "order_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9);
    fbq("init", "1031991443269058");
    fbq("trackCustom", "Order Booked", {}, { eventID: eventID });
    fetch("/capi.php?event_id=" + encodeURIComponent(eventID));
  </script>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Neuro Mantra</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arya:wght@400;700&family=Inknut+Antiqua:wght@400;700&family=Yantramanav:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #25234a;
        --secondary: #6558d3;
        --ink-soft: #4f4b78;
      }
      .font-arya {
        font-family: "Arya", sans-serif;
      }
      .font-inknut {
        font-family: "Inknut Antiqua", serif;
      }
      .font-yantra {
        font-family: "Yantramanav", sans-serif;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const params = new URLSearchParams(window.location.search);
        if (params.has("name") || params.has("phone"))
          window.history.replaceState(
            {},
            document.title,
            window.location.pathname,
          );
        try {
          const order = JSON.parse(
            localStorage.getItem("customerOrder") || "{}",
          );
          if (order.customerName)
            document.getElementById("customerName").textContent =
              ` ${order.customerName} ji`;
        } catch (error) {
          /* No order data is fine. */
        }
      });
    </script>
  </head>
  <body
    class="min-h-screen flex items-center justify-center px-4 py-6 font-inknut"
    style="
      background:
        radial-gradient(
          circle at top right,
          rgba(101, 88, 211, 0.16),
          transparent 50%
        ),
        #f3f1ff;
      color: var(--primary);
    "
  >
    <main
      class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-7 text-center"
      style="
        border: 3px solid var(--secondary);
        box-shadow: 0 20px 45px -12px rgba(37, 35, 74, 0.18);
      "
    >
      <div
        class="w-16 h-16 mx-auto mb-5 rounded-full flex items-center justify-center"
        style="
          background: linear-gradient(135deg, var(--secondary), var(--primary));
        "
      >
        <span class="text-white text-3xl">✓</span>
      </div>
      <h1 class="text-3xl leading-tight font-bold mb-3">
        Thank You<span id="customerName" style="color: var(--secondary)"></span
        >!
      </h1>
      <p class="text-lg font-semibold font-arya">
        Your order has been placed successfully.
      </p>
      <p class="mt-3 font-yantra" style="color: var(--ink-soft)">
        Our team will contact you shortly to confirm your order.
      </p>
      <a
        href="index.html"
        class="mt-7 block w-full py-3 rounded-2xl text-white text-base font-bold font-arya"
        style="
          background: linear-gradient(135deg, var(--secondary), var(--primary));
        "
        >Back to Home</a
      >
      <p class="mt-5 text-xs font-yantra" style="color: var(--ink-soft)">
        Neuro Mantra © All Rights Reserved
      </p>
    </main>
  </body>
</html>
