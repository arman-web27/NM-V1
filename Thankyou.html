<!doctype html>
<html lang="hi">
  <head>
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod
            ? n.callMethod.apply(n, arguments)
            : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(
        window,
        document,

        "https://connect.facebook.net/en_US/fbevents.js",
      );
      var eventID =
        "order_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9);
      fbq("init", "1031991443269058");

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Neuro Mantra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Halant:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #25234a;
        --secondary: #6558d3;
        --cream: #f3f1ff;
        --ink-soft: #4f4b78;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
      }
      body {
        background: #f3f1ff;
        color: var(--primary);
        font-family: "Halant", serif;
        display: flex;
        justify-content: center;
      }
      .page {
        width: 100%;
        max-width: 450px;
        min-height: 100vh;
        overflow: hidden;
        background: var(--cream);
        box-shadow: 0 0 36px rgba(37, 35, 74, 0.1);
      }
      .page-banner {
        width: 100%;
        height: auto;
        display: block;
      }
      .thankyou-section {
        padding: 34px 22px 42px;
      }
      .confirmation-card {
        background: #fff;
        border: 1.5px solid rgba(101, 88, 211, 0.28);
        border-radius: 22px;
        padding: 28px 20px 24px;
        text-align: center;
        box-shadow:
          8px 10px 0 rgba(37, 35, 74, 0.12),
          0 12px 24px rgba(37, 35, 74, 0.08);
      }
      .success-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font:
          700 34px/1 Arial,
          sans-serif;
        background: linear-gradient(135deg, var(--secondary), var(--primary));
      }
      h1 {
        color: var(--primary);
        font-size: 30px;
        line-height: 1.2;
        font-weight: 700;
      }
      h1 span {
        color: var(--secondary);
      }
      .lead {
        margin-top: 10px;
        color: var(--primary);
        font-size: 19px;
        line-height: 1.45;
        font-weight: 600;
      }
      .note {
        margin-top: 8px;
        color: var(--ink-soft);
        font-size: 17px;
        line-height: 1.5;
      }
      .product-wrap {
        margin: 24px auto 4px;
        padding: 16px;
        width: 100%;
        border-radius: 18px;
        background: linear-gradient(145deg, #f4f1ff, #fff);
        border: 1px solid rgba(101, 88, 211, 0.18);
      }
      .product-image {
        width: 100%;
        max-width: 220px;
        height: 220px;
        object-fit: contain;
        margin: 0 auto;
      }
      .product-name {
        margin-top: 4px;
        color: var(--primary);
        font-size: 20px;
        font-weight: 700;
      }
      .home-button {
        display: block;
        width: 100%;
        margin-top: 22px;
        padding: 12px 16px;
        border-radius: 14px;
        color: #fff;
        text-decoration: none;
        font-size: 18px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--secondary), var(--primary));
      }
      .footer-note {
        margin-top: 18px;
        color: var(--ink-soft);
        font-size: 13px;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const params = new URLSearchParams(window.location.search);
        if (params.has("name") || params.has("phone"))
          window.history.replaceState(
            {},
            document.title,
            window.location.pathname,
          );
        try {
          const order = JSON.parse(
            localStorage.getItem("customerOrder") || "{}",
          );
          if (order.customerName)
            document.getElementById("customerName").textContent =
              ` ${order.customerName} ji`;
        } catch (error) {}
      });
    </script>
  </head>
  <body>
    <div class="page">
      <main class="thankyou-section">
        <section class="confirmation-card" aria-labelledby="thankyou-title">
          <div class="success-icon" aria-hidden="true">✓</div>
          <h1 id="thankyou-title">Thank You<span id="customerName"></span>!</h1>
          <p class="lead">Your order has been placed successfully.</p>
          <p class="note">
            हमारी team जल्द ही आपसे order confirm करने के लिए संपर्क करेगी।
          </p>
          <div class="product-wrap">
            <img
              class="product-image"
              src="images/product.avif"
              alt="Neuro Mantra Syrup की बोतल"
            />
            <p class="product-name">Neuro Mantra Syrup</p>
          </div>
          <a class="home-button" href="index.html">Back to Home</a>
          <p class="footer-note">Neuro Mantra © All Rights Reserved</p>
        </section>
      </main>
    </div>
  </body>
</html>
